<!DOCTYPE html>
<html>
<head>
    <title>Gourmet & Co</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <script src="https://kit.fontawesome.com/623c1036bc.js" crossorigin="anonymous"></script>
</head>

<body>
    <div class="container mt-5 mb-5">
        <h1>Ejercicios</h1>
        <p> FullSatck 2 - seción 001V</p>

        <div class="card mt-4">
            <h2>Calculadora</h2>
            <div class="mb-3">
                <label class="form-label"> Número 1:</label>
                <input id="numero1" type="number" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label"> Número 2</label>
                <input id="numero2" type="number" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Operación</label>     
                <select id="operacion" class="form-select">
                    <option value="suma">Suma</option>
                    <option value="resta">Resta</option>
                    <option value="multiplicacion">Multiplicación</option>
                    <option value="division">División</option>
                </select> 
            </div>

            <button onclick="calcular()" class="btn btn-primary">Calcular</button>

            <h4 class="mt-3">Resultado: <span id="resultado"></span> </h4>
        </div>
        <i class="fa-solid fa-heart"></i>
        <i class="fa-brands fa-rebel"></i>
        <i class="fa-solid fa-user"></i>

        <div class="card mt-4">
            <div class="card-body">
                <h2>Calcular edad</h2>

                <div class="mb-3">
                    <label class="form-label">Fecha de nacimiento</label>
                    <input type="date" id="fecNac" class="form-control" max="2026-01-01" min="1940-01-01">
                </div>

                <button onclick="calcEdad()" class="btn btn-primary">Calcular edad</button>
                <h4 class="mt-4">Edad: <span id="edad"></span></h4>
            </div>

        </div>

    </div>

    <script src="js/script.js">  </script>

</body>
</html>
